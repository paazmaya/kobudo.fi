<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <defs>
    <style>text { font-family: 'Lexend', 'Segoe UI', sans-serif; }</style>
    <marker id="ar" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#8B1A1A"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#666666"/>
    </marker>
    <marker id="al" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#999999"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="980" fill="#F4F4F4"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#8B1A1A">Ryukyu Kobudō — Lineage of Taira Shinken (平 信賢)</text>
  <text x="600" y="58" text-anchor="middle" font-size="12" fill="#666666">Light Mode · dark red &amp; grey palette</text>

  <!-- ── ROW 1: Earliest ancestors ─────────────────────── -->

  <!-- Soeishi -->
  <rect x="30" y="78" width="190" height="54" rx="7" fill="#E2E2E2" stroke="#8B1A1A" stroke-width="1.5"/>
  <text x="125" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">Soeishi (添石)</text>
  <text x="125" y="118" text-anchor="middle" font-size="10" fill="#555555">Early bō master · Ryukyu Kingdom</text>

  <!-- Itosu Anko -->
  <rect x="475" y="78" width="190" height="54" rx="7" fill="#E2E2E2" stroke="#666666" stroke-width="1.5"/>
  <text x="570" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">Itosu Ankō (糸洲 安恒)</text>
  <text x="570" y="118" text-anchor="middle" font-size="10" fill="#555555">Shuri-te innovator</text>

  <!-- Higaonna -->
  <rect x="730" y="78" width="195" height="54" rx="7" fill="#E2E2E2" stroke="#666666" stroke-width="1.5"/>
  <text x="827" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">Higaonna Kanryō (東恩納)</text>
  <text x="827" y="118" text-anchor="middle" font-size="10" fill="#555555">Naha-te master</text>

  <!-- Itosu ↔ Higaonna shared line to Mabuni -->
  <line x1="665" y1="105" x2="730" y2="105" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- ── ROW 2 ─────────────────────────────────────────── -->

  <!-- Chinen Line -->
  <rect x="30" y="192" width="190" height="54" rx="7" fill="#E2E2E2" stroke="#8B1A1A" stroke-width="1.5"/>
  <text x="125" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">Chinen Line (知念系)</text>
  <text x="125" y="232" text-anchor="middle" font-size="10" fill="#555555">Yamani-no-Chinen · Shikiyanaka</text>

  <!-- Funakoshi -->
  <rect x="475" y="192" width="190" height="54" rx="7" fill="#D4D4D4" stroke="#666666" stroke-width="2"/>
  <text x="570" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">Funakoshi Gichin (船越 義珍)</text>
  <text x="570" y="232" text-anchor="middle" font-size="10" fill="#444444">Founder · Shōtōkan karate</text>

  <!-- Mabuni -->
  <rect x="730" y="192" width="195" height="54" rx="7" fill="#D4D4D4" stroke="#666666" stroke-width="2"/>
  <text x="827" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">Mabuni Kenwa (摩文仁 賢和)</text>
  <text x="827" y="232" text-anchor="middle" font-size="10" fill="#444444">Founder · Shitō-ryū</text>

  <!-- ── ROW 3: Yabiku ───────────────────────────────── -->

  <!-- Yabiku -->
  <rect x="30" y="306" width="190" height="54" rx="7" fill="#D4D4D4" stroke="#8B1A1A" stroke-width="2"/>
  <text x="125" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">Yabiku Moden (屋比久孟傳)</text>
  <text x="125" y="346" text-anchor="middle" font-size="10" fill="#333333">Founder · Ryukyu Kobujutsu Kenkyūkai</text>

  <!-- ── Vertical arrows in left column ────────────── -->
  <line x1="125" y1="132" x2="125" y2="188" stroke="#8B1A1A" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="125" y1="246" x2="125" y2="302" stroke="#8B1A1A" stroke-width="1.8" marker-end="url(#ar)"/>
  <!-- Vertical arrows mid -->
  <line x1="570" y1="132" x2="570" y2="188" stroke="#666666" stroke-width="1.8" marker-end="url(#ag)"/>
  <!-- Vertical arrows right -->
  <line x1="827" y1="132" x2="827" y2="188" stroke="#666666" stroke-width="1.8" marker-end="url(#ag)"/>

  <!-- ── Diagonal arrows converging on Taira ─────── -->
  <!-- Yabiku → Taira -->
  <line x1="220" y1="333" x2="446" y2="442" stroke="#8B1A1A" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="285" y="400" font-size="9" fill="#8B1A1A" transform="rotate(-21 285 400)">kobudō lineage</text>

  <!-- Funakoshi → Taira -->
  <line x1="570" y1="246" x2="553" y2="435" stroke="#666666" stroke-width="2" marker-end="url(#ag)"/>
  <text x="512" y="345" font-size="9" fill="#555555">karate (1922)</text>

  <!-- Mabuni → Taira -->
  <line x1="827" y1="246" x2="672" y2="432" stroke="#666666" stroke-width="2" marker-end="url(#ag)"/>
  <text x="755" y="353" font-size="9" fill="#555555" transform="rotate(-18 755 353)">karate &amp; kobudō ~1934–40</text>

  <!-- ── TAIRA SHINKEN ────────────────────────────── -->
  <rect x="436" y="440" width="268" height="72" rx="11" fill="#8B1A1A" stroke="#5C0E0E" stroke-width="2.5"/>
  <text x="570" y="466" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Taira Shinken (平 信賢)</text>
  <text x="570" y="484" text-anchor="middle" font-size="10" fill="#FFCCCC">42 kata · 8 weapons · Ryukyu Kobudō</text>
  <text x="570" y="500" text-anchor="middle" font-size="10" fill="#FFCCCC">Systematizer and major compiler</text>

  <!-- ── Branch trunk from Taira ─────────────────── -->
  <line x1="570" y1="512" x2="570" y2="545" stroke="#8B1A1A" stroke-width="2"/>
  <!-- Horizontal bar -->
  <line x1="88" y1="545" x2="1090" y2="545" stroke="#8B1A1A" stroke-width="1.8"/>
  <!-- Drops to students -->
  <line x1="88"   y1="545" x2="88"   y2="580" stroke="#8B1A1A" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="320"  y1="545" x2="320"  y2="580" stroke="#8B1A1A" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="800"  y1="545" x2="800"  y2="580" stroke="#8B1A1A" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="1090" y1="545" x2="1090" y2="580" stroke="#8B1A1A" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ── STUDENT BOXES ────────────────────────────── -->

  <!-- Inoue Motokatsu -->
  <rect x="10" y="580" width="158" height="66" rx="7" fill="#D4D4D4" stroke="#8B1A1A" stroke-width="1.5"/>
  <text x="89" y="602" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A1A">Inoue Motokatsu</text>
  <text x="89" y="618" text-anchor="middle" font-size="10" fill="#444444">(井上 元勝)</text>
  <text x="89" y="634" text-anchor="middle" font-size="9" fill="#555555">Codified all 42 kata; bunkai</text>

  <!-- Inoue Motokatsu → Inoue Kisho -->
  <line x1="89" y1="646" x2="89" y2="730" stroke="#8B1A1A" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Inoue Kisho -->
  <rect x="10" y="730" width="158" height="66" rx="7" fill="#C0C0C0" stroke="#8B1A1A" stroke-width="1.5"/>
  <text x="89" y="752" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A1A">Inoue Kishō (井上 貴勝)</text>
  <text x="89" y="768" text-anchor="middle" font-size="9" fill="#333333">President · Ryukyu Kobujutsu</text>
  <text x="89" y="783" text-anchor="middle" font-size="9" fill="#333333">Hozon Shinkōkai &amp; Yuishinkai</text>

  <!-- Akamine Eisuke -->
  <rect x="235" y="580" width="165" height="66" rx="7" fill="#D4D4D4" stroke="#8B1A1A" stroke-width="1.5"/>
  <text x="317" y="602" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A1A">Akamine Eisuke</text>
  <text x="317" y="618" text-anchor="middle" font-size="10" fill="#444444">Okinawan Ryukyu Kobudō</text>
  <text x="317" y="634" text-anchor="middle" font-size="9" fill="#555555">Yamane bō-heavy line</text>

  <!-- Yamane-ryu note feeding Akamine -->
  <rect x="235" y="476" width="158" height="38" rx="5" fill="#ECECEC" stroke="#999999" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="314" y="494" text-anchor="middle" font-size="9" fill="#555555">Yamane-line teachers</text>
  <text x="314" y="508" text-anchor="middle" font-size="9" fill="#555555">(Chinen Yamani-no-usume)</text>
  <line x1="314" y1="514" x2="314" y2="576" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#al)"/>

  <!-- Shimabuku Tatsuo -->
  <rect x="715" y="580" width="168" height="66" rx="7" fill="#D4D4D4" stroke="#8B1A1A" stroke-width="1.5"/>
  <text x="799" y="602" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A1A">Shimabuku Tatsuo</text>
  <text x="799" y="618" text-anchor="middle" font-size="10" fill="#444444">Isshin-ryū kobudō</text>
  <text x="799" y="634" text-anchor="middle" font-size="9" fill="#555555">Tokumine no Kun · Urashi no Kun</text>

  <!-- Various Karate Orgs -->
  <rect x="1005" y="580" width="165" height="66" rx="7" fill="#D4D4D4" stroke="#666666" stroke-width="1.5"/>
  <text x="1087" y="602" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A1A">Various Karate Orgs</text>
  <text x="1087" y="618" text-anchor="middle" font-size="9" fill="#444444">Shotokan · Shōrin-ryū</text>
  <text x="1087" y="634" text-anchor="middle" font-size="9" fill="#444444">Shitō-ryū · Gōjū-ryū</text>
  <text x="1087" y="648" text-anchor="middle" font-size="8" fill="#666666">(adopted Taira kata syllabi)</text>

  <!-- ── LEGEND ─────────────────────────────────── -->
  <rect x="30" y="848" width="500" height="98" rx="8" fill="#EAEAEA" stroke="#BBBBBB" stroke-width="1"/>
  <text x="50" y="870" font-size="12" font-weight="600" fill="#1A1A1A">Legend</text>
  <line x1="50" y1="888" x2="100" y2="888" stroke="#8B1A1A" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="112" y="892" font-size="10" fill="#333333">Direct kobudō transmission</text>
  <line x1="50" y1="908" x2="100" y2="908" stroke="#666666" stroke-width="2" marker-end="url(#ag)"/>
  <text x="112" y="912" font-size="10" fill="#333333">Karate influence</text>
  <line x1="50" y1="928" x2="100" y2="928" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="112" y="932" font-size="10" fill="#333333">Indirect / parallel influence</text>
  <rect x="295" y="876" width="13" height="13" rx="2" fill="#8B1A1A"/>
  <text x="314" y="888" font-size="10" fill="#333333">Central figure</text>
  <rect x="295" y="898" width="13" height="13" rx="2" fill="#D4D4D4" stroke="#8B1A1A" stroke-width="1"/>
  <text x="314" y="910" font-size="10" fill="#333333">Direct student / successor</text>
  <rect x="295" y="920" width="13" height="13" rx="2" fill="#E2E2E2" stroke="#666666" stroke-width="1"/>
  <text x="314" y="932" font-size="10" fill="#333333">Karate lineage ancestor</text>
</svg>
