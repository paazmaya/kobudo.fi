<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <defs>
    <style>text { font-family: 'Lexend', 'Segoe UI', sans-serif; }</style>
    <marker id="ar" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#C84040"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#999999"/>
    </marker>
    <marker id="al" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#666666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="980" fill="#1A1A1A"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#C84040">Ryukyu Kobudō — Lineage of Taira Shinken (平 信賢)</text>
  <text x="600" y="58" text-anchor="middle" font-size="12" fill="#888888">Dark Mode · dark red &amp; grey palette</text>

  <!-- ── ROW 1: Earliest ancestors ─────────────────────── -->

  <!-- Soeishi -->
  <rect x="30" y="78" width="190" height="54" rx="7" fill="#2E2E2E" stroke="#C84040" stroke-width="1.5"/>
  <text x="125" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#E0E0E0">Soeishi (添石)</text>
  <text x="125" y="118" text-anchor="middle" font-size="10" fill="#AAAAAA">Early bō master · Ryukyu Kingdom</text>

  <!-- Itosu Anko -->
  <rect x="475" y="78" width="190" height="54" rx="7" fill="#2E2E2E" stroke="#777777" stroke-width="1.5"/>
  <text x="570" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#E0E0E0">Itosu Ankō (糸洲 安恒)</text>
  <text x="570" y="118" text-anchor="middle" font-size="10" fill="#AAAAAA">Shuri-te innovator</text>

  <!-- Higaonna -->
  <rect x="730" y="78" width="195" height="54" rx="7" fill="#2E2E2E" stroke="#777777" stroke-width="1.5"/>
  <text x="827" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#E0E0E0">Higaonna Kanryō (東恩納)</text>
  <text x="827" y="118" text-anchor="middle" font-size="10" fill="#AAAAAA">Naha-te master</text>

  <!-- Itosu ↔ Higaonna dashed -->
  <line x1="665" y1="105" x2="730" y2="105" stroke="#555555" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- ── ROW 2 ─────────────────────────────────────────── -->

  <!-- Chinen Line -->
  <rect x="30" y="192" width="190" height="54" rx="7" fill="#2E2E2E" stroke="#C84040" stroke-width="1.5"/>
  <text x="125" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#E0E0E0">Chinen Line (知念系)</text>
  <text x="125" y="232" text-anchor="middle" font-size="10" fill="#AAAAAA">Yamani-no-Chinen · Shikiyanaka</text>

  <!-- Funakoshi -->
  <rect x="475" y="192" width="190" height="54" rx="7" fill="#3A3A3A" stroke="#777777" stroke-width="2"/>
  <text x="570" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#E0E0E0">Funakoshi Gichin (船越 義珍)</text>
  <text x="570" y="232" text-anchor="middle" font-size="10" fill="#BBBBBB">Founder · Shōtōkan karate</text>

  <!-- Mabuni -->
  <rect x="730" y="192" width="195" height="54" rx="7" fill="#3A3A3A" stroke="#777777" stroke-width="2"/>
  <text x="827" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#E0E0E0">Mabuni Kenwa (摩文仁 賢和)</text>
  <text x="827" y="232" text-anchor="middle" font-size="10" fill="#BBBBBB">Founder · Shitō-ryū</text>

  <!-- ── ROW 3: Yabiku ───────────────────────────────── -->

  <!-- Yabiku -->
  <rect x="30" y="306" width="190" height="54" rx="7" fill="#3A3A3A" stroke="#C84040" stroke-width="2"/>
  <text x="125" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#E0E0E0">Yabiku Moden (屋比久孟傳)</text>
  <text x="125" y="346" text-anchor="middle" font-size="10" fill="#BBBBBB">Founder · Ryukyu Kobujutsu Kenkyūkai</text>

  <!-- Vertical arrows left -->
  <line x1="125" y1="132" x2="125" y2="188" stroke="#C84040" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="125" y1="246" x2="125" y2="302" stroke="#C84040" stroke-width="1.8" marker-end="url(#ar)"/>
  <!-- Vertical arrows mid -->
  <line x1="570" y1="132" x2="570" y2="188" stroke="#999999" stroke-width="1.8" marker-end="url(#ag)"/>
  <!-- Vertical arrows right -->
  <line x1="827" y1="132" x2="827" y2="188" stroke="#999999" stroke-width="1.8" marker-end="url(#ag)"/>

  <!-- Diagonal arrows to Taira -->
  <!-- Yabiku → Taira -->
  <line x1="220" y1="333" x2="446" y2="442" stroke="#C84040" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="285" y="400" font-size="9" fill="#C84040" transform="rotate(-21 285 400)">kobudō lineage</text>

  <!-- Funakoshi → Taira -->
  <line x1="570" y1="246" x2="553" y2="435" stroke="#999999" stroke-width="2" marker-end="url(#ag)"/>
  <text x="510" y="345" font-size="9" fill="#888888">karate (1922)</text>

  <!-- Mabuni → Taira -->
  <line x1="827" y1="246" x2="672" y2="432" stroke="#999999" stroke-width="2" marker-end="url(#ag)"/>
  <text x="755" y="353" font-size="9" fill="#888888" transform="rotate(-18 755 353)">karate &amp; kobudō ~1934–40</text>

  <!-- ── TAIRA SHINKEN ────────────────────────────── -->
  <rect x="436" y="440" width="268" height="72" rx="11" fill="#7A1515" stroke="#C84040" stroke-width="2.5"/>
  <text x="570" y="466" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Taira Shinken (平 信賢)</text>
  <text x="570" y="484" text-anchor="middle" font-size="10" fill="#FFAAAA">42 kata · 8 weapons · Ryukyu Kobudō</text>
  <text x="570" y="500" text-anchor="middle" font-size="10" fill="#FFAAAA">Systematizer and major compiler</text>

  <!-- Branch trunk -->
  <line x1="570" y1="512" x2="570" y2="545" stroke="#C84040" stroke-width="2"/>
  <line x1="88" y1="545" x2="1090" y2="545" stroke="#C84040" stroke-width="1.8"/>
  <line x1="88"   y1="545" x2="88"   y2="580" stroke="#C84040" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="320"  y1="545" x2="320"  y2="580" stroke="#C84040" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="800"  y1="545" x2="800"  y2="580" stroke="#C84040" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="1090" y1="545" x2="1090" y2="580" stroke="#C84040" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Inoue Motokatsu -->
  <rect x="10" y="580" width="158" height="66" rx="7" fill="#3A3A3A" stroke="#C84040" stroke-width="1.5"/>
  <text x="89" y="602" text-anchor="middle" font-size="11" font-weight="600" fill="#E0E0E0">Inoue Motokatsu</text>
  <text x="89" y="618" text-anchor="middle" font-size="10" fill="#BBBBBB">(井上 元勝)</text>
  <text x="89" y="634" text-anchor="middle" font-size="9" fill="#AAAAAA">Codified all 42 kata; bunkai</text>

  <line x1="89" y1="646" x2="89" y2="730" stroke="#C84040" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Inoue Kisho -->
  <rect x="10" y="730" width="158" height="66" rx="7" fill="#444444" stroke="#C84040" stroke-width="1.5"/>
  <text x="89" y="752" text-anchor="middle" font-size="11" font-weight="600" fill="#E0E0E0">Inoue Kishō (井上 貴勝)</text>
  <text x="89" y="768" text-anchor="middle" font-size="9" fill="#BBBBBB">President · Ryukyu Kobujutsu</text>
  <text x="89" y="783" text-anchor="middle" font-size="9" fill="#BBBBBB">Hozon Shinkōkai &amp; Yuishinkai</text>

  <!-- Akamine -->
  <rect x="235" y="580" width="165" height="66" rx="7" fill="#3A3A3A" stroke="#C84040" stroke-width="1.5"/>
  <text x="317" y="602" text-anchor="middle" font-size="11" font-weight="600" fill="#E0E0E0">Akamine Eisuke</text>
  <text x="317" y="618" text-anchor="middle" font-size="10" fill="#BBBBBB">Okinawan Ryukyu Kobudō</text>
  <text x="317" y="634" text-anchor="middle" font-size="9" fill="#AAAAAA">Yamane bō-heavy line</text>

  <!-- Yamane note -->
  <rect x="235" y="476" width="158" height="38" rx="5" fill="#252525" stroke="#555555" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="314" y="494" text-anchor="middle" font-size="9" fill="#888888">Yamane-line teachers</text>
  <text x="314" y="508" text-anchor="middle" font-size="9" fill="#888888">(Chinen Yamani-no-usume)</text>
  <line x1="314" y1="514" x2="314" y2="576" stroke="#555555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#al)"/>

  <!-- Shimabuku -->
  <rect x="715" y="580" width="168" height="66" rx="7" fill="#3A3A3A" stroke="#C84040" stroke-width="1.5"/>
  <text x="799" y="602" text-anchor="middle" font-size="11" font-weight="600" fill="#E0E0E0">Shimabuku Tatsuo</text>
  <text x="799" y="618" text-anchor="middle" font-size="10" fill="#BBBBBB">Isshin-ryū kobudō</text>
  <text x="799" y="634" text-anchor="middle" font-size="9" fill="#AAAAAA">Tokumine no Kun · Urashi no Kun</text>

  <!-- Karate Orgs -->
  <rect x="1005" y="580" width="165" height="66" rx="7" fill="#3A3A3A" stroke="#777777" stroke-width="1.5"/>
  <text x="1087" y="602" text-anchor="middle" font-size="11" font-weight="600" fill="#E0E0E0">Various Karate Orgs</text>
  <text x="1087" y="618" text-anchor="middle" font-size="9" fill="#AAAAAA">Shotokan · Shōrin-ryū</text>
  <text x="1087" y="634" text-anchor="middle" font-size="9" fill="#AAAAAA">Shitō-ryū · Gōjū-ryū</text>
  <text x="1087" y="648" text-anchor="middle" font-size="8" fill="#777777">(adopted Taira kata syllabi)</text>

  <!-- ── LEGEND ─────────────────────────────────── -->
  <rect x="30" y="848" width="500" height="98" rx="8" fill="#252525" stroke="#444444" stroke-width="1"/>
  <text x="50" y="870" font-size="12" font-weight="600" fill="#E0E0E0">Legend</text>
  <line x1="50" y1="888" x2="100" y2="888" stroke="#C84040" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="112" y="892" font-size="10" fill="#BBBBBB">Direct kobudō transmission</text>
  <line x1="50" y1="908" x2="100" y2="908" stroke="#999999" stroke-width="2" marker-end="url(#ag)"/>
  <text x="112" y="912" font-size="10" fill="#BBBBBB">Karate influence</text>
  <line x1="50" y1="928" x2="100" y2="928" stroke="#555555" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="112" y="932" font-size="10" fill="#BBBBBB">Indirect / parallel influence</text>
  <rect x="295" y="876" width="13" height="13" rx="2" fill="#7A1515" stroke="#C84040" stroke-width="1"/>
  <text x="314" y="888" font-size="10" fill="#BBBBBB">Central figure</text>
  <rect x="295" y="898" width="13" height="13" rx="2" fill="#3A3A3A" stroke="#C84040" stroke-width="1"/>
  <text x="314" y="910" font-size="10" fill="#BBBBBB">Direct student / successor</text>
  <rect x="295" y="920" width="13" height="13" rx="2" fill="#2E2E2E" stroke="#777777" stroke-width="1"/>
  <text x="314" y="932" font-size="10" fill="#BBBBBB">Karate lineage ancestor</text>
</svg>
